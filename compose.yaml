services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cylbot
      POSTGRES_USER: cylbot
      POSTGRES_PASSWORD: cylbot_dev
    ports:
      - "5432:5432"
    volumes:
      - cylbot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cylbot -d cylbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cylbot-postgres-data:
